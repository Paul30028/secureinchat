<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="t d">
<title id="t">Two separate data paths</title>
<desc id="d">Top: a message is written on your phone and sealed there; the relay passes on a sealed envelope it cannot open; only the other phone opens it. Bottom: most tools work inside your browser; a few send one small lookup to an outside service. The two paths never meet.</desc>
<defs>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#123B3A" flood-opacity="0.12"/></filter>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2D6B60"/></marker>
  <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#E3A23B"/></marker>
  <g id="seal"><rect x="-16" y="-11" width="32" height="22" rx="4" fill="#FFFFFF" stroke="#2D6B60" stroke-width="1.5"/><path d="M-16-9L0 3L16-9" fill="none" stroke="#2D6B60" stroke-width="1.5" stroke-linejoin="round"/><circle cx="10" cy="7" r="5" fill="#E3A23B"/></g>
  <g id="lockc" fill="none" stroke-width="1.5" stroke-linecap="round"><rect x="-8" y="-2" width="16" height="12" rx="3"/><path d="M-5-2v-4a5 5 0 0 1 10 0v4"/></g>
  <g id="locko" fill="none" stroke-width="1.5" stroke-linecap="round"><rect x="-8" y="-2" width="16" height="12" rx="3"/><path d="M-5-2v-4a5 5 0 0 1 10 0"/></g>
</defs>
<rect width="760" height="400" fill="#FAF8F3"/>

<!-- Lane 1: a message -->
<rect x="24" y="24" width="200" height="164" rx="12" fill="#D7E6E1"/>
<rect x="536" y="24" width="200" height="164" rx="12" fill="#D7E6E1"/>
<!-- sender phone: readable message inside -->
<g filter="url(#sh)"><rect x="64" y="48" width="64" height="116" rx="12" fill="#FFFFFF" stroke="#123B3A" stroke-width="1.5"/></g>
<rect x="88" y="56" width="16" height="4" rx="2" fill="#123B3A"/>
<rect x="74" y="74" width="36" height="12" rx="6" fill="#D7E6E1"/>
<rect x="74" y="92" width="26" height="12" rx="6" fill="#D7E6E1"/>
<rect x="82" y="110" width="36" height="12" rx="6" fill="#2D6B60"/>
<!-- sealed on the device -->
<path d="M128 116H168" stroke="#2D6B60" stroke-width="1.5"/>
<use href="#seal" x="186" y="116"/>
<!-- ciphertext path -->
<path d="M204 116H600" stroke="#2D6B60" stroke-width="3" marker-end="url(#ag)"/>
<!-- relay: a closed box that only forwards -->
<g filter="url(#sh)"><rect x="300" y="64" width="160" height="104" rx="12" fill="#123B3A"/></g>
<rect x="316" y="80" width="128" height="72" rx="8" fill="none" stroke="#2D6B60" stroke-width="1.5"/>
<use href="#seal" x="380" y="116"/>
<use href="#lockc" x="428" y="90" stroke="#8DB5AA"/>
<!-- receiver phone: opened only here -->
<g filter="url(#sh)"><rect x="632" y="48" width="64" height="116" rx="12" fill="#FFFFFF" stroke="#123B3A" stroke-width="1.5"/></g>
<rect x="656" y="56" width="16" height="4" rx="2" fill="#123B3A"/>
<rect x="642" y="74" width="36" height="12" rx="6" fill="#D7E6E1"/>
<rect x="642" y="92" width="26" height="12" rx="6" fill="#D7E6E1"/>
<rect x="650" y="110" width="36" height="12" rx="6" fill="#2D6B60"/>
<use href="#locko" x="610" y="80" stroke="#2D6B60"/>

<!-- Lane 2: a tool -->
<rect x="24" y="212" width="320" height="164" rx="12" fill="#D7E6E1"/>
<g filter="url(#sh)"><rect x="56" y="236" width="256" height="116" rx="10" fill="#FFFFFF" stroke="#123B3A" stroke-width="1.5"/></g>
<path d="M56 258H312" stroke="#123B3A" stroke-width="1.5"/>
<g fill="#8DB5AA"><circle cx="70" cy="247" r="3"/><circle cx="80" cy="247" r="3"/><circle cx="90" cy="247" r="3"/></g>
<rect x="108" y="242" width="160" height="10" rx="5" fill="#FAF8F3"/>
<!-- file processed in place -->
<rect x="80" y="276" width="56" height="60" rx="6" fill="#FAF8F3" stroke="#123B3A" stroke-width="1.5"/>
<path d="M92 294h32M92 306h24M92 318h28" stroke="#8DB5AA" stroke-width="1.5" stroke-linecap="round"/>
<path d="M148 306h40" stroke="#2D6B60" stroke-width="1.5" marker-end="url(#ag)"/>
<rect x="200" y="276" width="56" height="60" rx="6" fill="#FAF8F3" stroke="#2D6B60" stroke-width="1.5"/>
<path d="M212 294h32M212 306h24" stroke="#2D6B60" stroke-width="1.5" stroke-linecap="round"/>
<!-- the one request that leaves -->
<path d="M312 306H592" stroke="#E3A23B" stroke-width="1.5" stroke-dasharray="6 6" marker-end="url(#ao)"/>
<rect x="420" y="296" width="40" height="20" rx="4" fill="#FFFFFF" stroke="#E3A23B" stroke-width="1.5"/>
<path d="M428 306h16" stroke="#E3A23B" stroke-width="1.5" stroke-linecap="round"/>
<!-- outside service -->
<rect x="576" y="212" width="160" height="164" rx="12" fill="none" stroke="#123B3A" stroke-width="1.5" stroke-dasharray="4 6"/>
<g filter="url(#sh)"><rect x="608" y="262" width="96" height="88" rx="8" fill="#FFFFFF" stroke="#123B3A" stroke-width="1.5"/></g>
<path d="M608 290H704M608 320H704" stroke="#123B3A" stroke-width="1.5"/>
<g fill="#8DB5AA"><circle cx="622" cy="276" r="3"/><circle cx="622" cy="305" r="3"/><circle cx="622" cy="335" r="3"/></g>

<!-- numbered badges (explained in the HTML caption) -->
<g font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="600" text-anchor="middle">
  <g fill="#123B3A"><circle cx="186" cy="88" r="11"/><circle cx="380" cy="48" r="11"/><circle cx="560" cy="48" r="11"/><circle cx="48" cy="236" r="11"/><circle cx="440" cy="280" r="11"/><circle cx="600" cy="236" r="11"/></g>
  <g fill="#FFFFFF"><text x="186" y="92">1</text><text x="380" y="52">2</text><text x="560" y="52">3</text><text x="48" y="240">4</text><text x="440" y="284">5</text><text x="600" y="240">6</text></g>
</g>
</svg>
