<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>模拟站点 B - 直接表单与假验证码</title>
    <style>
      body { font: 15px/1.5 -apple-system, "Segoe UI", sans-serif; max-width: 640px; margin: 32px auto; padding: 0 16px; color: #1c2b24; }
      h1 { font-size: 20px; }
      .panel { border: 1px solid #ccd8d2; border-radius: 8px; padding: 16px; margin-top: 16px; }
      label { display: block; margin: 10px 0 4px; font-size: 12px; color: #52655c; }
      input { width: 100%; padding: 7px; border: 1px solid #b9c9c1; border-radius: 6px; }
      button { margin-top: 12px; padding: 8px 12px; border: 1px solid #1f6f4a; background: #1f6f4a; color: #fff; border-radius: 6px; }
      .captcha { margin-top: 12px; padding: 12px; border: 1px dashed #b48a3c; background: #fdf7e9; border-radius: 6px; }
      .captcha label { display: inline; margin-left: 6px; font-size: 13px; color: #6a4d12; }
      .muted { color: #667; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>PeopleSearch Mock B</h1>
    <p class="muted">本地模拟站点。直接显示表单，并带一个假 CAPTCHA 占位。不会向任何外部地址发请求。</p>

    <section class="panel">
      <h2>退出申请</h2>
      <form id="optout-form">
        <label for="full-name">姓名</label>
        <input id="full-name" type="text" autocomplete="off">
        <label for="email">邮箱</label>
        <input id="email" type="email" autocomplete="off">

        <div id="captcha" class="captcha" data-captcha="mock">
          <strong>假 CAPTCHA 占位</strong>
          <div>
            <input id="captcha-checkbox" type="checkbox">
            <label for="captcha-checkbox">我不是机器人（仅本地占位，不验证）</label>
          </div>
        </div>

        <button id="final-submit" type="submit">提交退出申请</button>
      </form>
      <p class="muted">模拟站点：提交按钮只会记录一个本地标记，不发送任何数据。</p>
    </section>

    <script>
      (function () {
        'use strict';
        window.__submitted = false;
        window.__captchaTouched = false;
        document.getElementById('captcha-checkbox').addEventListener('change', function () {
          window.__captchaTouched = true;
        });
        document.getElementById('optout-form').addEventListener('submit', function (event) {
          event.preventDefault();
          window.__submitted = true;
        });
      })();
    </script>
  </body>
</html>
