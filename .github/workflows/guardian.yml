# Guardian core tests (plain Kotlin + an independent dnspython check).
name: guardian
on:
  workflow_dispatch:
  push:
    branches: [next, main, "feature/guardian*"]
    paths: ['guardian/**', '.github/workflows/guardian.yml']
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: guardian
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Kotlin compiler
        run: |
          curl -sSL -o /tmp/kc.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q /tmp/kc.zip -d /tmp
      - name: Core tests
        run: |
          /tmp/kotlinc/bin/kotlinc core/src/main/kotlin core/src/test/kotlin -include-runtime -d /tmp/g.jar
          java -cp /tmp/g.jar org.secureinchat.guardian.dns.DnsFilterTestKt
          java -cp /tmp/g.jar org.secureinchat.guardian.dns.DnsUpstreamTestKt
          java -cp /tmp/g.jar org.secureinchat.guardian.dns.QueryHandlerTestKt
          java -cp /tmp/g.jar org.secureinchat.guardian.dns.AppTallyTestKt
      - name: Independent oracle (dnspython)
        run: |
          /tmp/kotlinc/bin/kotlinc core/src/main/kotlin tests/oracle/Cli.kt -include-runtime -d /tmp/cli.jar
          pip install dnspython==2.8.0
          python3 tests/dns_oracle.py /tmp/cli.jar
  app:
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: guardian
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Android SDK licences
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Build debug APK and run Android lint
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Show lint report
        if: failure()
        run: cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true
      - name: Policy check
        run: python3 tests/policy_check.py app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guardian-debug-apk
          path: |
            guardian/app/build/outputs/apk/debug/app-debug.apk
            guardian/app/build/reports/lint-results-debug.html
  emulator:
    # G2 acceptance on API 29 and 34 emulators: start, block a listed domain (0.0.0.0), forward an
    # allowed one, stop from the app, start again, stop from the notification, no crash.
    needs: app
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [29, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: guardian-debug-apk, path: apk }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python3 guardian/tests/emulator_flow.py "$(find apk -name app-debug.apk | head -1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guardian-emulator-${{ matrix.api }}
          path: /tmp/guardian-flow
