name: Build Android APK

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # 用 npm install 而不是 npm ci：本仓库是 npm workspaces 且没有提交
      # lockfile（各包依赖版本在 package.json 里已经锁到具体版本）。
      - name: Install workspace dependencies
        run: npm install

      - name: Build web assets
        working-directory: apps/android-client
        # 不设这个的话默认是 ws://localhost:8765 —— 手机上没有这个服务，
        # 装上之后所有连接都失败，看起来像"扫码没反应""进不去群"。
        # 应用内「服务器设置」仍然可以覆盖它。
        env:
          VITE_RELAY_URL: wss://ws-next.secureinchat.com
          # TURN。跨运营商通话必需——两端都在 CGNAT 后面时 P2P 打不通，
          # 媒体要经服务器中继。
          #
          # ⚠️ 这个密码会被编译进 APK，反编译就能拿到，理论上有人可以拿它
          # 白嫖带宽做中继。内部试用可以接受（coturn 配了 user-quota 限制
          # 单用户并发）。要对外发布必须换成时限凭证（TURN REST API），
          # 由服务端按时间生成，客户端启动时去取。
          VITE_TURN_URL: turn:turn.secureinchat.com:3478
          VITE_TURN_USERNAME: secureinchat
          VITE_TURN_CREDENTIAL: sZpA3cJc5WaQ/gwCt/SWnOJlkpIJBuIr
        run: npx vite build

      # 把构建产物同步进 android/ 原生工程。android/ 目录本身已经提交在仓库里，
      # 所以这一步不需要重新 `cap add android`。
      - name: Sync Capacitor Android project
        working-directory: apps/android-client
        run: npx cap sync android

      - name: Build debug APK
        working-directory: apps/android-client/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # 冒烟检查：确认产物真的是个装得进东西的 APK，而不是空壳。
      # 原始需求第十六节明确要求"APK 必须包含完整资源和程序代码，不能是空壳
      # 或仅加载远程网页"——这里验证 JS 包和图标资源确实被打进去了。
      - name: Verify APK is not an empty shell
        working-directory: apps/android-client/android
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          echo "APK size: $(du -h "$APK" | cut -f1)"
          unzip -l "$APK" > /tmp/apk-contents.txt
          echo "--- bundled web assets ---"
          grep "assets/public" /tmp/apk-contents.txt | head -20
          echo "--- launcher icons ---"
          grep "ic_launcher" /tmp/apk-contents.txt | head -10
          # 没有打包进 JS 主包 = 空壳，直接失败
          grep -q "assets/public/assets/index-.*\.js" /tmp/apk-contents.txt \
            || (echo "FAIL: 没有找到打包的 JS 主包，APK 可能是空壳" && exit 1)
          grep -q "assets/public/index.html" /tmp/apk-contents.txt \
            || (echo "FAIL: 没有找到 index.html" && exit 1)
          grep -q "ic_launcher" /tmp/apk-contents.txt \
            || (echo "FAIL: 没有找到应用图标资源" && exit 1)
          echo "OK: APK 包含完整的 web 资源和图标"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: secureinchat-debug-apk
          path: apps/android-client/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
