# Build and test the Permission Checkup Android app on GitHub's runners (the dev sessions cannot download the SDK).
name: permcheck
on:
  workflow_dispatch:
  push:
    branches: [next, main, "feature/T11-*"]
    tags: ['permcheck-v*']
    paths: ['android/permcheck/**', '.github/workflows/permcheck.yml']
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android/permcheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      # ubuntu-latest ships an Android SDK in $ANDROID_HOME; accept licences for the platforms the build needs.
      - name: Android SDK licences
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Core logic tests (plain Kotlin)
        run: |
          curl -sSL -o /tmp/kc.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q /tmp/kc.zip -d /tmp
          /tmp/kotlinc/bin/kotlinc core/src/main/kotlin core/src/test/kotlin -include-runtime -d /tmp/pc.jar
          for t in RiskRulesTestKt CollectTestKt LedgerTestKt ExecutorTestKt RestoreTestKt; do java -cp /tmp/pc.jar org.secureinchat.permcheck.core.$t; done
      - name: Policy check (no INTERNET permission, no dependencies)
        run: python3 tests/policy_check.py
      - name: Build debug APK and run Android lint
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug :testtarget:assembleDebug
      - name: Inspect APK permissions
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | tail -1)
          $AAPT dump permissions app/build/outputs/apk/debug/app-debug.apk | tee /tmp/perms.txt
          if grep -q "android.permission.INTERNET" /tmp/perms.txt; then echo "INTERNET permission found"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: permcheck-debug-apk
          path: |
            android/permcheck/app/build/outputs/apk/debug/app-debug.apk
            android/permcheck/app/build/reports/lint-results-debug.html
      # Test-only target app for the emulator flow test (never released).
      - uses: actions/upload-artifact@v4
        with:
          name: permcheck-test-target
          path: android/permcheck/tests/testtarget/build/outputs/apk/debug/testtarget-debug.apk
  emulator:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [29, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: permcheck-debug-apk, path: apk }
      - uses: actions/download-artifact@v4
        with: { name: permcheck-test-target, path: target }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          # Smoke test, then the T11 change-record flow (revoke -> record -> restart -> restore -> clear).
          script: |
            sh android/permcheck/tests/emulator_smoke.sh "$(find apk -name app-debug.apk | head -1)"
            python3 android/permcheck/tests/emulator_flow.py "$(find apk -name app-debug.apk | head -1)" "$(find target -name testtarget-debug.apk | head -1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-${{ matrix.api }}
          path: |
            /tmp/permcheck-smoke
            /tmp/permcheck-flow
  release:
    # Runs only for tags like permcheck-v0.1.0, after the build and both emulator tests pass.
    if: startsWith(github.ref, 'refs/tags/permcheck-v')
    needs: [build-test, emulator]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: permcheck-debug-apk, path: apk }
      - name: Create GitHub Release with the tested APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          APK=$(find apk -name app-debug.apk | head -1)
          cp "$APK" "permcheck-${TAG#permcheck-v}-test.apk"
          sha256sum permcheck-*.apk > SHA256SUMS.txt
          gh release create "$TAG" permcheck-*.apk SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "Permission Checkup ${TAG#permcheck-v} (test build)" \
            --notes "Test build of SecureInChat Permission Checkup for Android 8.0+. Lists apps with risky permissions and special access, ranked by risk, and opens the right settings page so you can turn access off. Requests no INTERNET permission, so it cannot send your data anywhere. Built and checked on GitHub Actions: core logic tests, Android lint, APK permission check, launch test on Android 10 and Android 14 emulators. Not yet tested on a physical phone. Signed with a test (debug) key: a later signed release will need an uninstall first. Advanced mode (Shizuku) is not included yet. Check the file against SHA256SUMS.txt. GPL-3.0-or-later."
