# DeepSeek worker: when a spec lands in drop/claude/<task>.txt, send it to the DeepSeek API
# and commit the answer to drop/deepseek/<task>/roundN.txt on the same branch.
# Needs the repository secret DEEPSEEK_API_KEY (Paul creates it). Optional repository
# variable DEEPSEEK_MODEL (default deepseek-chat). Without the secret the job does nothing.
name: DeepSeek worker
on:
  push:
    paths: ["drop/claude/*.txt"]
  workflow_dispatch:
    inputs:
      spec:
        description: "Spec file, e.g. drop/claude/p2a.txt"
        required: true
permissions:
  contents: write
concurrency:
  group: deepseek-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ask:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Find specs to send
        id: specs
        run: |
          if [ -n "${{ github.event.inputs.spec }}" ]; then
            echo "files=${{ github.event.inputs.spec }}" >> "$GITHUB_OUTPUT"
          else
            files=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'drop/claude/*.txt' | tr '\n' ' ')
            echo "files=$files" >> "$GITHUB_OUTPUT"
          fi
      - name: Ask DeepSeek
        if: steps.specs.outputs.files != ''
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-chat' }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then echo "No DEEPSEEK_API_KEY secret; skipping."; exit 0; fi
          python3 scripts/deepseek_ask.py ${{ steps.specs.outputs.files }}
      - name: Commit answers
        if: steps.specs.outputs.files != ''
        run: |
          git config user.name "deepseek-worker"
          git config user.email "deepseek-worker@users.noreply.github.com"
          git add drop/deepseek || true
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "DeepSeek answer for: ${{ steps.specs.outputs.files }}"
          git push
